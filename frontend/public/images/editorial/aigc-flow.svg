<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title"><title id="title">前端输入与模型接口之间</title><rect width="1200" height="680" fill="#faf9f6"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif">
