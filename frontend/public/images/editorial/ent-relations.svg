<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title"><title id="title">文章与标签的多对多关系</title><rect width="1200" height="680" fill="#faf9f6"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif">
<text x="60" y="90" fill="#263e38" font-size="36" font-weight="600">文章与标签的多对多关系</text>
<path d="M60 123 H1140" stroke="#d8ddd6"/>
<rect x="60" y="200" width="320" height="160" rx="6" fill="#fff" stroke="#c6d0c6" stroke-width="2"/>
<text x="84" y="264" fill="#263e38" font-size="30" font-weight="500">文章</text>
<text x="84" y="309" fill="#5b6b65" font-size="19">一篇可以有多个标签</text>
<path d="M390 279 h36 m-9 -8 9 8 -9 8" fill="none" stroke="#718d7c" stroke-width="2"/>
<rect x="440" y="200" width="320" height="160" rx="6" fill="#fff" stroke="#c6d0c6" stroke-width="2"/>
<text x="464" y="264" fill="#263e38" font-size="30" font-weight="500">关联表</text>
<text x="464" y="309" fill="#5b6b65" font-size="19">保存文章与标签的关系</text>
<path d="M770 279 h36 m-9 -8 9 8 -9 8" fill="none" stroke="#718d7c" stroke-width="2"/>
<rect x="820" y="200" width="320" height="160" rx="6" fill="#fff" stroke="#c6d0c6" stroke-width="2"/>
<text x="844" y="264" fill="#263e38" font-size="30" font-weight="500">标签</text>
<text x="844" y="309" fill="#5b6b65" font-size="19">一个可被多篇文章复用</text>
<path d="M60 430 h320" stroke="#c6d0c6"/>
<text x="60" y="485" fill="#263e38" font-size="27" font-weight="500">双向查询</text>
<text x="60" y="530" fill="#5b6b65" font-size="21">从两端读取同一关系</text>
<path d="M440 430 h320" stroke="#c6d0c6"/>
<text x="440" y="485" fill="#263e38" font-size="27" font-weight="500">解除关联</text>
<text x="440" y="530" fill="#5b6b65" font-size="21">保留其他共享关系</text>
<path d="M820 430 h320" stroke="#c6d0c6"/>
<text x="820" y="485" fill="#263e38" font-size="27" font-weight="500">约束核对</text>
<text x="820" y="530" fill="#5b6b65" font-size="21">Schema、迁移与数据库</text>
</g></svg>