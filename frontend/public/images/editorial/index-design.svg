<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title"><title id="title">字符串索引要核对什么</title><rect width="1200" height="680" fill="#faf9f6"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif">
<text x="60" y="90" fill="#263e38" font-size="36" font-weight="600">字符串索引要核对什么</text>
<path d="M60 123 H1140" stroke="#d8ddd6"/>
<rect x="60" y="200" width="320" height="160" rx="6" fill="#fff" stroke="#c6d0c6" stroke-width="2"/>
<text x="84" y="264" fill="#263e38" font-size="30" font-weight="500">业务输入</text>
<text x="84" y="309" fill="#5b6b65" font-size="19">实际长度与唯一性需求</text>
<path d="M390 279 h36 m-9 -8 9 8 -9 8" fill="none" stroke="#718d7c" stroke-width="2"/>
<rect x="440" y="200" width="320" height="160" rx="6" fill="#fff" stroke="#c6d0c6" stroke-width="2"/>
<text x="464" y="264" fill="#263e38" font-size="30" font-weight="500">字段与字符集</text>
<text x="464" y="309" fill="#5b6b65" font-size="19">字符数量不等于字节数</text>
<path d="M770 279 h36 m-9 -8 9 8 -9 8" fill="none" stroke="#718d7c" stroke-width="2"/>
<rect x="820" y="200" width="320" height="160" rx="6" fill="#fff" stroke="#c6d0c6" stroke-width="2"/>
<text x="844" y="264" fill="#263e38" font-size="30" font-weight="500">索引与约束</text>
<text x="844" y="309" fill="#5b6b65" font-size="19">在目标环境验证</text>
<path d="M60 430 h320" stroke="#c6d0c6"/>
<text x="60" y="485" fill="#263e38" font-size="27" font-weight="500">环境信息</text>
<text x="60" y="530" fill="#5b6b65" font-size="21">版本、表结构与排序规则</text>
<path d="M440 430 h320" stroke="#c6d0c6"/>
<text x="440" y="485" fill="#263e38" font-size="27" font-weight="500">边界数据</text>
<text x="440" y="530" fill="#5b6b65" font-size="21">长度、大小写与冲突</text>
<path d="M820 430 h320" stroke="#c6d0c6"/>
<text x="820" y="485" fill="#263e38" font-size="27" font-weight="500">消费者</text>
<text x="820" y="530" fill="#5b6b65" font-size="21">接口、表单与历史数据</text>
</g></svg>