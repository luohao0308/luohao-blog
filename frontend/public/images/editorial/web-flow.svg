<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title"><title id="title">一次请求经过的三层系统</title><rect width="1200" height="680" fill="#faf9f6"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif">
<text x="60" y="90" fill="#263e38" font-size="36" font-weight="600">一次请求经过的三层系统</text>
<path d="M60 123 H1140" stroke="#d8ddd6"/>
<rect x="60" y="200" width="320" height="160" rx="6" fill="#fff" stroke="#c6d0c6" stroke-width="2"/>
<text x="84" y="264" fill="#263e38" font-size="30" font-weight="500">浏览器</text>
<text x="84" y="309" fill="#5b6b65" font-size="19">页面、路由与登录态</text>
<path d="M390 279 h36 m-9 -8 9 8 -9 8" fill="none" stroke="#718d7c" stroke-width="2"/>
<rect x="440" y="200" width="320" height="160" rx="6" fill="#fff" stroke="#c6d0c6" stroke-width="2"/>
<text x="464" y="264" fill="#263e38" font-size="30" font-weight="500">Nuxt BFF</text>
<text x="464" y="309" fill="#5b6b65" font-size="19">/api 前缀与 Cookie 适配</text>
<path d="M770 279 h36 m-9 -8 9 8 -9 8" fill="none" stroke="#718d7c" stroke-width="2"/>
<rect x="820" y="200" width="320" height="160" rx="6" fill="#fff" stroke="#c6d0c6" stroke-width="2"/>
<text x="844" y="264" fill="#263e38" font-size="30" font-weight="500">Kratos API</text>
<text x="844" y="309" fill="#5b6b65" font-size="19">服务、业务与数据</text>
<path d="M60 430 h320" stroke="#c6d0c6"/>
<text x="60" y="485" fill="#263e38" font-size="27" font-weight="500">会话恢复</text>
<text x="60" y="530" fill="#5b6b65" font-size="21">刷新与登出闭环</text>
<path d="M440 430 h320" stroke="#c6d0c6"/>
<text x="440" y="485" fill="#263e38" font-size="27" font-weight="500">字段更新</text>
<text x="440" y="530" fill="#5b6b65" font-size="21">读取后合并 FieldMask</text>
<path d="M820 430 h320" stroke="#c6d0c6"/>
<text x="820" y="485" fill="#263e38" font-size="27" font-weight="500">文章渲染</text>
<text x="820" y="530" fill="#5b6b65" font-size="21">Markdown 转为 HTML</text>
</g></svg>