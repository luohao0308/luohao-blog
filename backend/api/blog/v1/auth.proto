syntax = "proto3";

package blog.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/luohao0308/luohao-blog/backend/api/blog/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.blog.v1";
option java_outer_classname = "AuthProto";

// AuthService issues and revokes the credentials used to call privileged
// endpoints. Registration is open: anyone can create a READER account with an
// email, a password, and a display name (no email verification yet; abuse is
// bounded by per-IP rate limiting and comment pre-moderation). ADMIN accounts
// are still created only by the seed command. The access
// token is a short-lived JWT carried in the
// Authorization header; the refresh token is an opaque secret delivered as an
// httpOnly cookie (Path=/v1/auth) and rotated on every refresh, with the
// server-side session kept in Redis. Refresh and Logout read the token from
// the cookie, falling back to the X-Refresh-Token header for non-cookie
// clients.
service AuthService {
  // Register creates a READER account and signs the caller in: the reply is
  // the same token pair Login returns, delivered with the refresh cookie.
  // Returns INVALID_ARGUMENT when fields fail validation and CONFLICT when
  // the email is already registered. Rate limited per client IP; excess
  // attempts return TOO_MANY_REQUESTS.
  rpc Register (RegisterRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }

  // Login verifies credentials and returns an access token, a refresh token
  // cookie, and the account. Returns INVALID_ARGUMENT when fields are empty
  // and UNAUTHORIZED when the credentials are wrong (indistinguishable
  // between unknown email and wrong password). Rate limited per client IP;
  // excess attempts return TOO_MANY_REQUESTS.
  rpc Login (LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  // Refresh rotates the refresh session and returns a new access token and a
  // replacement refresh cookie. Each refresh token is single-use: replaying a
  // rotated one is rejected with UNAUTHORIZED. Returns UNAUTHORIZED when the
  // cookie (or header) is missing, expired, revoked, or belongs to a deleted
  // account.
  rpc Refresh (RefreshRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  }

  // Logout revokes the refresh session and clears the refresh cookie. The
  // operation is idempotent: logout without a valid session still clears the
  // cookie and succeeds. The just-issued access token remains valid until it
  // expires (at most access_token_ttl).
  rpc Logout (LogoutRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }

  // GetMe returns the account identified by the access token in the
  // Authorization header. Returns UNAUTHORIZED when the token is missing,
  // malformed, forged, or expired.
  rpc GetMe (GetMeRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/auth/me"
    };
  }

  // UpdatePassword rotates the calling account's password. The current
  // password must be supplied and is verified before the change; the new
  // password follows the same rules as account creation (at least 8
  // characters). Existing refresh sessions keep working until their natural
  // expiry; the next login must use the new password.
  // Authorization: any authenticated account (Authorization: Bearer).
  // Returns UNAUTHORIZED when the old password is wrong, INVALID_ARGUMENT
  // when fields are empty or the new password is too short.
  rpc UpdatePassword (UpdatePasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/auth/update-password"
      body: "*"
    };
  }
}

// UpdatePasswordRequest is the input for AuthService.UpdatePassword. Both
// fields ride in the request body; the target account comes from the access
// token, never from the payload.
message UpdatePasswordRequest {
  // Current password, verified before the change.
  string old_password = 1 [(google.api.field_behavior) = REQUIRED];
  // New password; at least 8 characters, same rule as account creation.
  string new_password = 2 [(google.api.field_behavior) = REQUIRED];
}

// UserRole is the account role. Values mirror the domain model; ADMIN can
// author and manage articles, READER is a self-registered reader account
// that can comment and manage its own profile.
enum UserRole {
  // Default value. Never returned by the server.
  USER_ROLE_UNSPECIFIED = 0;
  // Can author and manage articles.
  USER_ROLE_ADMIN = 1;
  // Self-registered reader; comments and manages its own profile.
  USER_ROLE_READER = 2;
}

// User is the public representation of an account. Credentials never appear
// in responses.
message User {
  // Application-generated UUID identifier.
  string id = 1;
  // Lowercased login email.
  string email = 2;
  // Human-readable name shown on the site.
  string display_name = 3;
  // Account role.
  UserRole role = 4;
  // Time at which the account was created. Server-assigned.
  google.protobuf.Timestamp created_at = 5;
  // Site-relative avatar path, e.g. /v1/assets/avatars/<random>.<ext>, or
  // empty when no avatar was uploaded. Clients resolve it against the API
  // origin (the Nuxt BFF prefixes /api).
  string avatar_url = 6;
}

// RegisterRequest is the input for AuthService.Register. The new account is
// always a READER; ADMIN accounts exist only through the seed command.
message RegisterRequest {
  // Login email, matched case-insensitively and stored lowercased.
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  // Plaintext password; at least 8 characters. Sent once over TLS.
  string password = 2 [(google.api.field_behavior) = REQUIRED];
  // Public display name, 1-32 characters.
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];
}

// LoginRequest is the input for AuthService.Login.
message LoginRequest {
  // Login email, matched case-insensitively.
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  // Plaintext password. Sent once over TLS; never stored in clear text.
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

// LoginReply is the output of Login and Refresh. The refresh token itself is
// delivered as an httpOnly cookie and is deliberately not part of the body.
message LoginReply {
  // Signed access token for the Authorization: Bearer header.
  string access_token = 1;
  // Fixed to "Bearer".
  string token_type = 2;
  // Seconds until access_token expires. Clients should refresh proactively
  // before this elapses.
  int64 expires_in = 3;
  // The authenticated account.
  User user = 4;
}

// RefreshRequest is the input for AuthService.Refresh. The refresh token is
// transported out of band (cookie or X-Refresh-Token header), so the message
// body is empty.
message RefreshRequest {
}

// LogoutRequest is the input for AuthService.Logout. Like Refresh, the
// refresh token arrives via cookie or header.
message LogoutRequest {
}

// GetMeRequest is the input for AuthService.GetMe. The caller is identified
// by the access token, not by any request field.
message GetMeRequest {
}
