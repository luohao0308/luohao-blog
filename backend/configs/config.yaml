server:
  http:
    addr: 0.0.0.0:8000
    # Must cover the slowest endpoint: chat generation waits on the LLM.
    timeout: 60s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 60s
data:
  database:
    driver: mysql
    source: ${DATABASE_SOURCE:root:root123@tcp(127.0.0.1:3307)/blog?timeout=5s&multiStatements=true&parseTime=True&loc=Local&charset=utf8mb4}
    # Development conveniences. Keep both false in production and apply schema
    # changes as a separate reviewed step.
    debug: true
    auto_migrate: true
  redis:
    addr: ${REDIS_ADDR:127.0.0.1:6379}
    read_timeout: 0.2s
    write_timeout: 0.2s
auth:
  jwt:
    # Required. Generate once per environment, e.g. `openssl rand -hex 32`,
    # and export as KRATOS_JWT_SECRET (env sources are KRATOS_-prefixed).
    # Never commit a real key.
    secret: ${JWT_SECRET:}
    # protojson durations only accept seconds (s).
    access_token_ttl: 900s # 15m
  # Sliding: recreated on every refresh. 604800s = 7d.
  refresh_token_ttl: 604800s
  rate_limit:
    login_attempts: 10
    login_window: 300s # 5m
    # Anonymous comment submissions. Defaults when unset: 20 per 5m per IP.
    comment_attempts: 20
    comment_window: 300s # 5m

es:
  addresses:
    - http://127.0.0.1:9200
  # Index name for articles; created on boot when missing.
  index: articles

# OpenAI-compatible embedding for semantic search vectors. Leave base_url
# empty (or unset the env vars) to run the search index BM25-only; vectors
# appear after setting the env vars and re-running `go run ./cmd/reindex`.
# Real keys live in secrets.local.yaml (git-ignored; template:
# secrets.local.example.yaml) — never in this committed file.
embedding:
  # e.g. https://api.openai.com/v1 — the client appends /embeddings.
  base_url: ${EMBEDDING_BASE_URL:}
  # Bearer token; inject via environment, never commit a real key.
  api_key: ${EMBEDDING_API_KEY:}
  # e.g. text-embedding-3-small; must match the provider model name.
  model: ${EMBEDDING_MODEL:}
  # Must equal the model's vector dimension; sizes the ES dense_vector field.
  dimensions: ${EMBEDDING_DIMENSIONS:0}
  timeout: 10s
