# 复制为 secrets.local.yaml（同目录，已被 .gitignore 忽略）后填入真实值。
# 本文件随仓库提交，但绝不放真实 key。
#
# 加载机制：kratos 合并 configs/ 目录下全部文件，本文件的值按字段深合并
# 覆盖 config.yaml，因此这里只需要写和默认值不同的字段。
# 优先级：secrets.local.yaml > 环境变量（KRATOS_*）> config.yaml 默认值。

auth:
  jwt:
    # 本机固定签名密钥（如 openssl rand -hex 32 生成）；设置后无需 KRATOS_JWT_SECRET
    secret:

embedding:
  # OpenAI 兼容端点，如 https://api.siliconflow.cn/v1；模型如 BAAI/bge-m3（1024 维）
  base_url:
  api_key:
  model:
  dimensions: 0   # 必须与模型输出一致；bge-m3 = 1024

llm:
  # OpenAI 兼容聊天端点（M4/S3 聊天生成），如 https://api.deepseek.com；模型如 deepseek-chat
  base_url:
  api_key:
  model:

wechat:
  # 小程序 AppSecret（mp.weixin.qq.com → 开发管理 → 开发设置 → 生成）
  app_secret:
