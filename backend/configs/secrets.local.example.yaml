# 复制为 secrets.local.yaml（同目录，已被 .gitignore 忽略）后填入真实值。
# 本文件随仓库提交，但绝不放真实 key；所有字段都是可选项——
# 不配置 embedding 时索引自动降级为 BM25-only。
#
# 加载机制：kratos 会合并 configs/ 目录下全部文件，本文件的值按字段
# 覆盖 config.yaml（深合并），因此这里只需要写和默认值不同的字段。
# 优先级：secrets.local.yaml > 环境变量（KRATOS_EMBEDDING_*）> config.yaml 默认值。
embedding:
  # OpenAI 兼容端点，如 https://api.siliconflow.cn/v1 或 https://api.deepseek.com
  base_url:
  api_key:
  model:            # 如 BAAI/bge-m3
  dimensions: 0     # 必须与模型输出一致，bge-m3 = 1024
