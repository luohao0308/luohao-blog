syntax = "proto3";
package kratos.api;

option go_package = "github.com/go-kratos/kratos-layout/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  // Elasticsearch cluster for article full-text search. Absent disables
  // indexing and search endpoints return empty results.
  Es es = 4;
  // OpenAI-compatible embedding service for semantic search vectors. Absent
  // or incomplete disables vector generation: the search index stays
  // BM25-only and everything else keeps working.
  Embedding embedding = 5;
  // OpenAI-compatible chat LLM for retrieval-augmented answers (M4/S3).
  // Absent or incomplete disables the Chat RPC's generation side.
  Llm llm = 6;
  // WeChat mini-program login (T-011/S2). Absent or incomplete disables the
  // wechat auth endpoints with FAILED_PRECONDITION.
  Wechat wechat = 7;
}

message Wechat {
  // Mini program AppID, e.g. wx58089476f518fd3f. Public by design.
  string app_id = 1;
  // Mini program AppSecret from the mp.weixin.qq.com console. Provide it via
  // the git-ignored secrets file, never in source control.
  string app_secret = 2;
}

message Llm {
  // Base URL of an OpenAI-compatible API, e.g. https://api.deepseek.com.
  // The client appends /chat/completions. Empty disables chat generation.
  string base_url = 1;
  // API key sent as a bearer token. Provide it via environment or the
  // git-ignored secrets file, never in source control.
  string api_key = 2;
  // Chat model name, e.g. deepseek-chat.
  string model = 3;
  // Per-request timeout. Defaults to 120s when unset: reasoning models can
  // legitimately think for a long time before the first token.
  google.protobuf.Duration timeout = 4;
  // Optional reasoning effort sent as reasoning_effort (provider-specific
  // meaning; DeepSeek: none/low/high/max, default high). Set only when the
  // target provider supports it — DeepSeek defaults to minutes-long thinking,
  // so interactive chat wants "none" there.
  string reasoning_effort = 5;
}

message Es {
  // Node addresses, e.g. http://127.0.0.1:9200.
  repeated string addresses = 1;
  // Index name for articles. Defaults to "articles".
  string index = 2;
}

message Embedding {
  // Base URL of an OpenAI-compatible API, e.g. https://api.openai.com/v1.
  // The client appends /embeddings. Empty disables vector generation.
  string base_url = 1;
  // API key sent as a bearer token. Provide it via environment, never in
  // source control.
  string api_key = 2;
  // Embedding model name, e.g. text-embedding-3-small.
  string model = 3;
  // Vector dimension of the model output; sizes the ES dense_vector field.
  // Must match the model exactly. Required when base_url is set.
  int32 dimensions = 4;
  // Per-request timeout. Defaults to 10s when unset.
  google.protobuf.Duration timeout = 5;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    // Driver name registered with database/sql, e.g. "mysql".
    string driver = 1;
    // Driver-specific DSN. Keep credentials out of version control.
    string source = 2;
    // Log every generated statement. Development only.
    bool debug = 3;
    // Create or update tables from the ent schema on startup. Leave false in
    // production and apply migrations as a separate, reviewed step.
    bool auto_migrate = 4;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
  // Directory for user-uploaded files (currently avatars). Created on boot
  // when missing. Defaults to ./data/uploads when unset; production mounts a
  // named Docker volume here so uploads survive container replacement.
  string uploads_dir = 3;
}

message Auth {
  message JWT {
    // HMAC-SHA256 signing key for access tokens. Required: the server refuses
    // to start when empty. Provide it via environment, not source control.
    string secret = 1;
    // Access token lifetime. Defaults to 15m when unset.
    google.protobuf.Duration access_token_ttl = 2;
  }
  message RateLimit {
    // Login attempts allowed per client IP inside login_window, for both
    // successful and failed logins. Defaults to 10 when unset.
    int64 login_attempts = 1;
    // Fixed window size for the login counter. Defaults to 5m when unset.
    google.protobuf.Duration login_window = 2;
    // Comment submissions allowed per client IP inside comment_window.
    // Defaults to 20 when unset.
    int64 comment_attempts = 3;
    // Fixed window size for the comment counter. Defaults to 5m when unset.
    google.protobuf.Duration comment_window = 4;
    // Chat questions allowed per client IP inside chat_window. Defaults to
    // 10 when unset.
    int64 chat_attempts = 5;
    // Fixed window size for the chat counter. Defaults to 5m when unset.
    google.protobuf.Duration chat_window = 6;
    // Public search queries allowed per client IP inside search_window.
    // Defaults to 60 when unset.
    int64 search_attempts = 9;
    // Fixed window size for the search counter. Defaults to 1m when unset.
    google.protobuf.Duration search_window = 10;
    // Account registrations allowed per client IP inside register_window.
    // Defaults to 10 when unset.
    int64 register_attempts = 7;
    // Fixed window size for the registration counter. Defaults to 5m when
    // unset.
    google.protobuf.Duration register_window = 8;
  }
  // Access token signing settings.
  JWT jwt = 1;
  // Refresh session lifetime in Redis. Sliding: recreated on every refresh.
  // Defaults to 168h (7 days) when unset.
  google.protobuf.Duration refresh_token_ttl = 2;
  // Login brute-force protection.
  RateLimit rate_limit = 3;
}
