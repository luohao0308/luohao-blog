# Authorization model: subjects are policy vocabulary, not user ids.
#
#   public        — unauthenticated requests
#   authenticated — any valid account (inherits public)
#   admin/reader  — account roles (biz.UserRole); both inherit authenticated
#
# r.act is the HTTP method for HTTP route templates. gRPC full-method rows
# use "*" because the operation name already encodes the action; the enforcer
# caller supplies "*" as the request act for gRPC too.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && (p.act == "*" || r.act == p.act)
