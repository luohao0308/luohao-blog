                    allOf:
                        - $ref: '#/components/schemas/blog.v1.CategoryBrief'
                    description: |-
                        Single curated category of the article. Server-managed through
                         Create/UpdateArticle on the category field; absent when uncategorized.
            description: Article is the canonical representation of a blog article.
        blog.v1.ArticleSet:
            type: object
            properties:
                articles:
                    type: array
                    items:
                        $ref: '#/components/schemas/blog.v1.Article'
                    description: The page of articles in the order requested by ListArticlesRequest.order_by.
                next_page_token:
                    type: string
                    description: |-
                        Token used to retrieve the next page via ListArticlesRequest.page_token.
                         Empty when there are no more results.
            description: ArticleSet is a paginated collection of articles returned by ListArticles.
        blog.v1.Category:
            required:
                - slug
                - name
            type: object
            properties:
                id:
                    type: string
                    description: Application-generated UUIDv7 identifier. Read-only on create.
                slug:
                    type: string
                    description: Unique URL-safe identifier in [a-z0-9-]. Immutable after creation.
                name:
                    type: string
                    description: Human-readable display label, e.g. "工程实践".
                sort:
                    type: integer
                    description: Navigation order; lower comes first. Defaults to 0.
                    format: int32
                articleCount:
                    type: string
                    description: |-
                        Number of published articles in the category. Read-only; populated by
