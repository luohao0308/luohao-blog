                 Authorization: ADMIN only (Authorization: Bearer).
                 Returns NOT_FOUND if no subscriber exists with the supplied email.
            operationId: SubscriberService_DeleteSubscriber
            parameters:
                - name: email
                  in: path
                  description: Email address to remove. Compared case-insensitively.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/user/avatar:
        put:
            tags:
                - UserService
            description: |-
                UploadAvatar stores a new avatar for the calling account and returns the
                 updated account. The image rides in the JSON body as base64 `data`
                 (clients canvas-downscale before sending). The server sniffs the real
                 format from magic bytes — jpeg, png, or webp — and rejects anything
                 else, or anything above 2 MiB after decoding, with INVALID_ARGUMENT.
                 Overwriting replaces the stored file; the random filename changes, so
                 cached copies of the old image keep working but stop being referenced.
            operationId: UserService_UploadAvatar
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/blog.v1.UploadAvatarRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/blog.v1.User'
    /v1/user/profile:
        put:
            tags:
                - UserService
            description: |-
                UpdateProfile renames the calling account. The display name is the
                 identity shown on comments and the header menu. Returns
                 INVALID_ARGUMENT when the name is empty or longer than 32 characters and
                 UNAUTHORIZED when the token is missing, malformed, forged, or expired.
            operationId: UserService_UpdateProfile
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/blog.v1.UpdateProfileRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/blog.v1.User'
components:
    schemas:
        blog.v1.ApproveCommentRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: Identifier of the comment to approve.
            description: ApproveCommentRequest is the input for CommentService.ApproveComment.
        blog.v1.Article:
            required:
                - slug
                - title
                - content_md
            type: object
            properties:
                id:
                    type: string
                    description: Application-generated UUIDv7 identifier. Read-only on create.
                slug:
                    type: string
                    description: Unique URL-safe identifier in [a-z0-9-]. Immutable after creation.
                title:
                    type: string
                    description: Human-readable title.
                summary:
                    type: string
                    description: |-
                        Optional short excerpt used in list views; derived from content_md when
                         empty.
                content_md:
                    type: string
                    description: Markdown source of the article body.
                content_html:
                    type: string
                    description: |-
                        Server-rendered HTML for content_md. Read-only: regenerated whenever
                         content_md changes.
                tags:
                    type: array
                    items:
                        type: string
                    description: Tag names attached to the article. Tags are created on first use.
                status:
                    type: integer
                    description: |-
                        Lifecycle state. Server-assigned: new articles start as DRAFT; move them
                         with UpdateArticle on status; DeleteArticle moves them to DELETED.
                    format: enum
                published_at:
                    type: string
                    description: Time at which the article first moved to PUBLISHED. Server-assigned.
                    format: date-time
                created_at:
                    type: string
                    description: Time at which the article was created. Server-assigned, read-only.
                    format: date-time
                updated_at:
                    type: string
                    description: Time at which the article was last modified. Server-assigned, read-only.
                    format: date-time
                view_count:
                    type: string
                    description: |-
                        Public read counter. Incremented when a client reports a view through
                         MarkArticleViewed and the 24h per-client dedup window admits it.
                likeCount:
                    type: string
                    description: |-
                        Public like counter. Incremented when a client reports a like through
                         MarkArticleLiked and the 24h per-client dedup window admits it.
                category:
                    allOf:
                        - $ref: '#/components/schemas/blog.v1.CategoryBrief'
                    description: |-
                        Single curated category of the article. Server-managed through
                         Create/UpdateArticle on the category field; absent when uncategorized.
            description: Article is the canonical representation of a blog article.
        blog.v1.ArticleSet:
            type: object
            properties:
                articles:
                    type: array
                    items:
                        $ref: '#/components/schemas/blog.v1.Article'
                    description: The page of articles in the order requested by ListArticlesRequest.order_by.
                next_page_token:
                    type: string
                    description: |-
                        Token used to retrieve the next page via ListArticlesRequest.page_token.
                         Empty when there are no more results.
            description: ArticleSet is a paginated collection of articles returned by ListArticles.
        blog.v1.BindWechatRequest:
            required:
                - bindingTicket
                - email
                - password
            type: object
            properties:
                bindingTicket:
                    type: string
                    description: |-
                        Ticket from a WechatLogin reply with status BINDING_REQUIRED. Single
                         use; consumed even when the bind itself fails.
                email:
                    type: string
                    description: Login email of the existing account to attach the openid to.
                password:
                    type: string
                    description: Password of that account; verified before binding.
            description: BindWechatRequest is the input for AuthService.BindWechat.
        blog.v1.Category:
            required:
                - slug
                - name
            type: object
            properties:
                id:
                    type: string
                    description: Application-generated UUIDv7 identifier. Read-only on create.
                slug:
                    type: string
                    description: Unique URL-safe identifier in [a-z0-9-]. Immutable after creation.
                name:
                    type: string
                    description: Human-readable display label, e.g. "工程实践".
                sort:
                    type: integer
                    description: Navigation order; lower comes first. Defaults to 0.
                    format: int32
                articleCount:
                    type: string
                    description: |-
                        Number of published articles in the category. Read-only; populated by
                         ListCategories only.
                created_at:
                    type: string
                    description: Time at which the category was created. Server-assigned, read-only.
                    format: date-time
                updated_at:
                    type: string
                    description: Time at which the category was last modified. Server-assigned, read-only.
                    format: date-time
            description: Category is the canonical representation of an article category.
        blog.v1.CategoryBrief:
            type: object
            properties:
                slug:
                    type: string
                    description: |-
                        Unique slug of the category; the public identifier used in filters and
                         category routes.
                name:
                    type: string
                    description: Display name of the category.
            description: CategoryBrief is the category summary attached to an article response.
        blog.v1.CategorySet:
            type: object
            properties:
                categories:
                    type: array
                    items:
                        $ref: '#/components/schemas/blog.v1.Category'
                    description: The page of categories ordered by sort, then slug.
                next_page_token:
                    type: string
                    description: |-
                        Token used to retrieve the next page via ListCategoriesRequest.page_token.
                         Empty when there are no more results.
            description: CategorySet is a paginated collection of categories.
        blog.v1.ChatReply:
            type: object
            properties:
                answer:
                    type: string
                    description: The generated answer. Plain text, not Markdown.
                citations:
                    type: array
                    items:
                        $ref: '#/components/schemas/blog.v1.CitedArticle'
                    description: The published articles the answer drew from, best-match first.
            description: ChatReply is the retrieval-augmented answer.
        blog.v1.ChatRequest:
            required:
                - query
            type: object
            properties:
                query:
                    type: string
                    description: The visitor's question, answered from published article content.
                topK:
                    type: integer
                    description: Optional. How many articles to retrieve as context (1-8). Defaults to 4.
                    format: int32
            description: ChatRequest is the input for ChatService.Chat.
        blog.v1.CitedArticle:
            type: object
            properties:
                slug:
                    type: string
                title:
                    type: string
                summary:
                    type: string
            description: CitedArticle identifies one source article of the answer.
        blog.v1.Comment:
            type: object
            properties:
                id:
                    type: string
                    description: Application-generated UUIDv7 identifier. Read-only.
                articleSlug:
                    type: string
                    description: Slug of the commented article.
                displayName:
                    type: string
                    description: |-
                        Author display name: the account's profile name at submission time for
                         account comments; the visitor-provided name for legacy anonymous rows.
                content:
                    type: string
                    description: Comment body.
                status:
                    type: integer
                    description: 'Moderation state. Server-assigned: new comments start PENDING.'
                    format: enum
                created_at:
                    type: string
                    description: Time at which the comment was created. Server-assigned, read-only.
                    format: date-time
                updated_at:
                    type: string
                    description: Time at which the comment was last modified. Server-assigned, read-only.
                    format: date-time
                userId:
                    type: string
                    description: Author account identifier. Empty for legacy anonymous comments.
                avatarUrl:
                    type: string
                    description: |-
                        Author avatar as a site-relative path (see User.avatar_url). Empty for
                         legacy anonymous comments and accounts without an upload; clients fall
                         back to an initials disc.
            description: Comment is the canonical representation of an article comment.
        blog.v1.CommentSet:
            type: object
            properties:
                comments:
                    type: array
                    items:
                        $ref: '#/components/schemas/blog.v1.Comment'
                next_page_token:
                    type: string
                    description: |-
                        Token used to retrieve the next page. Empty when there are no more
                         results.
            description: CommentSet is a paginated collection of comments.
        blog.v1.CreateCommentRequest:
            required:
                - articleSlug
                - content
            type: object
            properties:
                articleSlug:
                    type: string
                    description: |-
                        Slug of the article being commented on. Must reference a PUBLISHED
                         article.
                content:
                    type: string
                    description: Comment body, 1-1000 characters.
            description: |-
                CreateCommentRequest is the input for CommentService.CreateComment. The
                 author is the authenticated caller; the payload carries no identity.
        blog.v1.LoginReply:
            type: object
            properties:
                accessToken:
                    type: string
                    description: 'Signed access token for the Authorization: Bearer header.'
                tokenType:
                    type: string
                    description: Fixed to "Bearer".
                expiresIn:
                    type: string
                    description: |-
                        Seconds until access_token expires. Clients should refresh proactively
                         before this elapses.
                user:
                    allOf:
                        - $ref: '#/components/schemas/blog.v1.User'
                    description: The authenticated account.
            description: |-
                LoginReply is the output of Login and Refresh. The refresh token itself is
                 delivered as an httpOnly cookie and is deliberately not part of the body.
        blog.v1.LoginRequest:
            required:
                - email
                - password
            type: object
            properties:
                email:
                    type: string
                    description: Login email, matched case-insensitively.
                password:
                    type: string
                    description: Plaintext password. Sent once over TLS; never stored in clear text.
            description: LoginRequest is the input for AuthService.Login.
        blog.v1.LogoutRequest:
            type: object
            properties: {}
            description: |-
                LogoutRequest is the input for AuthService.Logout. Like Refresh, the
                 refresh token arrives via cookie or header.
        blog.v1.MarkArticleLikedRequest:
            required:
                - slug
            type: object
            properties:
                slug:
                    type: string
                    description: Unique slug of the article being liked.
            description: |-
                MarkArticleLikedRequest is the input for ArticleService.MarkArticleLiked.
                 The client identity comes from the transport (client IP), not from the
                 message body.
        blog.v1.MarkArticleViewedRequest:
            required:
                - slug
            type: object
            properties:
                slug:
                    type: string
                    description: Unique slug of the article being viewed.
            description: |-
                MarkArticleViewedRequest is the input for ArticleService.MarkArticleViewed.
                 The client identity comes from the transport (client IP), not from the
                 message body.
        blog.v1.RefreshRequest:
            type: object
            properties: {}
            description: |-
                RefreshRequest is the input for AuthService.Refresh. The refresh token is
                 transported out of band (cookie or X-Refresh-Token header), so the message
                 body is empty.
        blog.v1.RegisterRequest:
            required:
                - email
                - password
                - displayName
            type: object
            properties:
                email:
                    type: string
                    description: Login email, matched case-insensitively and stored lowercased.
                password:
                    type: string
                    description: Plaintext password; at least 8 characters. Sent once over TLS.
                displayName:
                    type: string
                    description: Public display name, 1-32 characters.
            description: |-
                RegisterRequest is the input for AuthService.Register. The new account is
                 always a READER; ADMIN accounts exist only through the seed command.
        blog.v1.SubscribeRequest:
            required:
                - email
            type: object
            properties:
                email:
                    type: string
                    description: Email address to register. Stored lowercased.
            description: SubscribeRequest is the input for SubscriberService.Subscribe.
        blog.v1.Subscriber:
            required:
                - email
            type: object
            properties:
                id:
                    type: string
                    description: Application-generated UUIDv7 identifier. Read-only.
                email:
                    type: string
                    description: Lowercased email address, unique.
                created_at:
                    type: string
                    description: |-
                        Time at which the subscription was registered. Server-assigned,
                         read-only.
                    format: date-time
            description: Subscriber is the canonical representation of a registered email.
        blog.v1.SubscriberSet:
            type: object
            properties:
                subscribers:
                    type: array
                    items:
                        $ref: '#/components/schemas/blog.v1.Subscriber'
                    description: The page of subscribers, newest first.
                next_page_token:
                    type: string
                    description: |-
                        Token used to retrieve the next page via
                         ListSubscribersRequest.page_token. Empty when there are no more results.
            description: SubscriberSet is a paginated collection of subscribers.
        blog.v1.UpdatePasswordRequest:
            required:
                - oldPassword
                - newPassword
            type: object
            properties:
                oldPassword:
                    type: string
                    description: Current password, verified before the change.
                newPassword:
                    type: string
                    description: New password; at least 8 characters, same rule as account creation.
            description: |-
                UpdatePasswordRequest is the input for AuthService.UpdatePassword. Both
                 fields ride in the request body; the target account comes from the access
                 token, never from the payload.
        blog.v1.UpdateProfileRequest:
            required:
                - displayName
            type: object
            properties:
                displayName:
                    type: string
                    description: New public display name, 1-32 characters after trimming.
            description: |-
                UpdateProfileRequest is the input for UserService.UpdateProfile. The
                 target account comes from the access token, never from the payload.
        blog.v1.UploadAvatarRequest:
            required:
                - data
            type: object
            properties:
                data:
                    type: string
                    description: |-
                        Raw image bytes (jpeg/png/webp), at most 2 MiB after the transport
                         decodes the base64 JSON encoding.
                    format: bytes
            description: |-
                UploadAvatarRequest is the input for UserService.UploadAvatar. The target
                 account comes from the access token, never from the payload.
        blog.v1.User:
            type: object
            properties:
                id:
                    type: string
                    description: Application-generated UUID identifier.
                email:
                    type: string
                    description: Lowercased login email.
                displayName:
                    type: string
                    description: Human-readable name shown on the site.
                role:
                    type: integer
                    description: Account role.
                    format: enum
                created_at:
                    type: string
                    description: Time at which the account was created. Server-assigned.
                    format: date-time
                avatarUrl:
                    type: string
                    description: |-
                        Site-relative avatar path, e.g. /v1/assets/avatars/<random>.<ext>, or
                         empty when no avatar was uploaded. Clients resolve it against the API
                         origin (the Nuxt BFF prefixes /api).
            description: |-
                User is the public representation of an account. Credentials never appear
                 in responses.
        blog.v1.WechatLoginReply:
            type: object
            properties:
                status:
                    type: integer
                    description: Which follow-up the client should take.
                    format: enum
                login:
                    allOf:
                        - $ref: '#/components/schemas/blog.v1.LoginReply'
                    description: |-
                        Token pair for the bound account; set only when status is OK. The
                         refresh token travels as the standard cookie / X-Refresh-Token.
                bindingTicket:
                    type: string
                    description: |-
                        Single-use, 10-minute ticket identifying the unbound openid; set only
                         when status is BINDING_REQUIRED. Pass it to BindWechat.
            description: |-
                WechatLoginReply is the output of AuthService.WechatLogin. Exactly one of
                 `login` or `binding_ticket` is meaningful, selected by `status`.
        blog.v1.WechatLoginRequest:
            required:
                - code
            type: object
            properties:
                code:
                    type: string
                    description: |-
                        Temporary login code from wx.login in the mini program. Single-use and
                         short-lived on WeChat's side; the server exchanges it immediately.
            description: WechatLoginRequest is the input for AuthService.WechatLogin.
tags:
    - name: ArticleSearchService
      description: |-
        ArticleSearchService serves full-text search over published articles. The
         index is maintained by the article write path; when the search backend is
         unavailable the endpoint returns an empty page rather than an error, so the
         public site keeps working.
    - name: ArticleService
      description: |-
        ArticleService manages blog articles. The public identifier of an article is
         its slug: it is unique, URL-safe, and immutable after creation.
    - name: AuthService
      description: |-
        AuthService issues and revokes the credentials used to call privileged
         endpoints. Registration is open: anyone can create a READER account with an
         email, a password, and a display name (no email verification yet; abuse is
         bounded by per-IP rate limiting and comment pre-moderation). ADMIN accounts
         are still created only by the seed command. The access
         token is a short-lived JWT carried in the
         Authorization header; the refresh token is an opaque secret delivered as an
         httpOnly cookie (Path=/v1/auth) and rotated on every refresh, with the
         server-side session kept in Redis. Refresh and Logout read the token from
         the cookie, falling back to the X-Refresh-Token header for non-cookie
         clients.
    - name: CategoryService
      description: |-
        CategoryService manages the article category taxonomy. A category is a
         single-level, admin-curated grouping: an article belongs to at most one
         category and may be uncategorized. The public identifier is the slug:
         unique, URL-safe, and immutable after creation.

         Route order matters: the mux matches in registration order, so the static
         list route MUST be declared before the {slug} param routes — otherwise
         GET /v1/categories/list resolves to GetCategory and inherits its
         admin-only policy (see the route-order test in internal/server).
    - name: ChatService
      description: |-
        ChatService answers visitor questions with retrieval-augmented generation:
         the question is answered from the blog's published articles, and the reply
         cites the articles the answer drew from. Generation requires the LLM config;
         retrieval reuses the hybrid article search. Authorization: public.
    - name: CommentService
      description: |-
        CommentService handles article comments. Commenters are authenticated
         accounts: readers register openly through the auth service, and every new
         comment is authored by the caller's account (identity comes from the
         access token, never from the payload). Every new comment starts PENDING
         and becomes publicly visible only after an admin approves it. Legacy rows
         from the closed-registration era have no user and keep their stored
         display name. Admin operations require the ADMIN role; public reads stay
         open and submissions are rate limited per client IP.
    - name: SubscriberService
      description: |-
        SubscriberService registers emails for future article notifications. Actual
         sending is not wired yet: subscribing records the email so a future sender
         can pick the list up. Subscribe is idempotent — re-subscribing an existing
         email succeeds without change, so the public endpoint does not leak which
         addresses are registered.
    - name: UserService
      description: |-
        UserService manages the profile of the authenticated account: the display
         name and the avatar. Every operation is identified by the access token —
         the payload never names a target account, so an account can only ever edit
         itself. Avatars live on the server's local disk (no object store in the
         production topology); the bytes are served back through GetAvatar as a raw
         HTTP body.
