                created_at:
                    type: string
                    description: Time at which the category was created. Server-assigned, read-only.
                    format: date-time
                updated_at:
                    type: string
                    description: Time at which the category was last modified. Server-assigned, read-only.
                    format: date-time
            description: Category is the canonical representation of an article category.
