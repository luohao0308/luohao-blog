                    items:
                        $ref: '#/components/schemas/blog.v1.CitedArticle'
                    description: The published articles the answer drew from, best-match first.
            description: ChatReply is the retrieval-augmented answer.
        blog.v1.ChatRequest:
            required:
                - query
            type: object
            properties:
                query:
                    type: string
                    description: The visitor's question, answered from published article content.
                topK:
                    type: integer
                    description: Optional. How many articles to retrieve as context (1-8). Defaults to 4.
                    format: int32
            description: ChatRequest is the input for ChatService.Chat.
        blog.v1.CitedArticle:
            type: object
            properties:
                slug:
                    type: string
                title:
                    type: string
                summary:
                    type: string
            description: CitedArticle identifies one source article of the answer.
        blog.v1.Comment:
            type: object
