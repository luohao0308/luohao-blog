openapi: 3.0.3
info:
    title: ArticleService API
    description: |-
        ArticleService manages blog articles. The public identifier of an article is
         its slug: it is unique, URL-safe, and immutable after creation.
    version: 0.0.1
paths:
    /v1/articles/create:
        post:
            tags:
                - ArticleService
            description: |-
                CreateArticle creates a new article and returns the persisted record with
                 the server-assigned id, timestamps, rendered HTML, and DRAFT status.
                 Returns INVALID_ARGUMENT if the payload fails validation, or ALREADY_EXISTS
                 if the slug is taken.
            operationId: ArticleService_CreateArticle
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/blog.v1.Article'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/blog.v1.Article'
    /v1/articles/list:
        get:
            tags:
                - ArticleService
            description: |-
                ListArticles returns a page of articles, optionally filtered and ordered.
                 Use the next_page_token from ArticleSet to retrieve subsequent pages.
                 Returns INVALID_ARGUMENT if filter, order_by, or page_token are malformed.
            operationId: ArticleService_ListArticles
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    Optional. Maximum number of articles to return in a single page.
                     The server may apply a default and a maximum when unset or out of range.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Optional. Token from a previous response's next_page_token used to fetch
                     the next page. Leave empty to request the first page.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Optional. The standard list filter.
                     Supported fields:
                        * `slug` (i.e. `slug:"m0-scaffold"`)
                        * `title` (i.e. `title:"kratos"`)
                        * `status` (i.e. `status:"PUBLISHED"`)
                        * `tag` (i.e. `tag:"go"`)
                        * `published_at` range (i.e. `published_at>="2026-01-01T00:00:00Z"`)
                        * `created_at` range, `updated_at` range
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Optional. A comma-separated list of fields to order by.
                     Supported fields:
                        * `slug`
                        * `title`
                        * `published_at`
                        * `created_at`
                        * `updated_at`
                     Append ` desc` to a field for descending order, e.g. `published_at desc`.
                     Defaults to ascending order when no direction is supplied.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/blog.v1.ArticleSet'
    /v1/articles/update:
        put:
            tags:
                - ArticleService
            description: |-
                UpdateArticle applies a partial update to an existing article using a
                 FieldMask. Only the fields listed in update_mask are overwritten; all
                 other fields are left unchanged. The slug is immutable and only identifies
                 the target record here. Updating content_md re-renders content_html.
                 Returns NOT_FOUND if the target article does not exist, or
                 INVALID_ARGUMENT if update_mask references unknown fields.
            operationId: ArticleService_UpdateArticle
            parameters:
                - name: updateMask
                  in: query
                  description: |-
                    Set of field paths in article to overwrite. Fields not listed are left
                     unchanged. Use a single path of `*` to replace every mutable field.
                  schema:
                    type: string
                    format: field-mask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/blog.v1.Article'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/blog.v1.Article'
    /v1/articles/{slug}:
        get:
            tags:
                - ArticleService
            description: |-
                GetArticle returns a single article by its slug.
                 Returns NOT_FOUND if no article exists with the supplied slug.
            operationId: ArticleService_GetArticle
            parameters:
                - name: slug
                  in: path
                  description: Unique slug of the article to retrieve.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/blog.v1.Article'
        delete:
            tags:
                - ArticleService
            description: |-
                DeleteArticle soft-deletes an article by its slug. The record is retained
                 by the server but no longer appears in GetArticle or ListArticles results.
                 Returns NOT_FOUND if no article exists with the supplied slug.
            operationId: ArticleService_DeleteArticle
            parameters:
                - name: slug
                  in: path
                  description: Unique slug of the article to delete.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
components:
    schemas:
        blog.v1.Article:
            required:
                - slug
                - title
                - contentMd
            type: object
            properties:
                id:
                    type: string
                    description: Application-generated UUIDv7 identifier. Read-only on create.
                slug:
                    type: string
                    description: Unique URL-safe identifier in [a-z0-9-]. Immutable after creation.
                title:
                    type: string
                    description: Human-readable title.
                summary:
                    type: string
                    description: |-
                        Optional short excerpt used in list views; derived from content_md when
                         empty.
                contentMd:
                    type: string
                    description: Markdown source of the article body.
                contentHtml:
                    type: string
                    description: |-
                        Server-rendered HTML for content_md. Read-only: regenerated whenever
                         content_md changes.
                tags:
                    type: array
                    items:
                        type: string
                    description: Tag names attached to the article. Tags are created on first use.
                status:
                    type: integer
                    description: |-
                        Lifecycle state. Server-assigned: new articles start as DRAFT; move them
                         with UpdateArticle on status; DeleteArticle moves them to DELETED.
                    format: enum
                publishedAt:
                    type: string
                    description: Time at which the article first moved to PUBLISHED. Server-assigned.
                    format: date-time
                createdAt:
                    type: string
                    description: Time at which the article was created. Server-assigned, read-only.
                    format: date-time
                updatedAt:
                    type: string
                    description: Time at which the article was last modified. Server-assigned, read-only.
                    format: date-time
            description: Article is the canonical representation of a blog article.
        blog.v1.ArticleSet:
            type: object
            properties:
                articles:
                    type: array
                    items:
                        $ref: '#/components/schemas/blog.v1.Article'
                    description: The page of articles in the order requested by ListArticlesRequest.order_by.
                nextPageToken:
                    type: string
                    description: |-
                        Token used to retrieve the next page via ListArticlesRequest.page_token.
                         Empty when there are no more results.
            description: ArticleSet is a paginated collection of articles returned by ListArticles.
tags:
    - name: ArticleService
