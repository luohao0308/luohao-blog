# 复制为 secrets.local.yaml（同目录，已被 .gitignore 忽略）后填入真实值。
# 这是生产密钥文件：放在服务器上，绝不提交。优先级高于环境变量。
#
# 生成 JWT 密钥：openssl rand -hex 32

auth:
  jwt:
    secret:

mail:
  # DirectMail发信地址与专用SMTP密码。
  # 填完全部字段并完成发信域名验证后，再改为 true。
  enabled: false
  username:
  password:
  from_address:

embedding:
  # 如 https://api.siliconflow.cn/v1 + BAAI/bge-m3（1024 维）
  base_url:
  api_key:
  model:
  dimensions: 0

llm:
  # 如 https://api.deepseek.com + deepseek-flash
  base_url:
  api_key:
  model:
  reasoning_effort: none

wechat:
  # 迁移与旧身份回填验收后才启用；切号前备份原配置，不覆盖旧凭据。
  # KRATOS_WECHAT_ENABLED 可显式关闭入口，同时保留本段凭据。
  enabled: false
  app_id: wxf27116cc66cc49a4
  app_secret:

# 公众号凭据，和小程序 wechat 配置完全独立。
# 填好凭据、public site_url和微信永久封面素材ID后显式启用。
# mode: draft=只写草稿，publish=公开发表，mass=向所有关注者群发。
official_account:
  enabled: false
  app_id:
  app_secret:
  site_url:
  default_thumb_media_id:
  mode: draft
  image_hosts: []
