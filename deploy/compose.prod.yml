# 生产 compose：caddy + frontend + backend + mysql + redis + es 单机全栈。
# 密钥与域名经 deploy/.env.prod 提供（模板 .env.prod.example，Git 忽略真实值）；
# 后端密钥放 deploy/prod-conf/secrets.local.yaml（Git 忽略）。
#
# 用法（服务器上）：
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env.prod up -d
#   docker compose -f deploy/compose.prod.yml ps   # 等 caddy/frontend/backend/mysql healthy

name: luohao-blog-prod

# 容器日志轮转：json-file 每容器 10MB×3，防 caddy 访问日志等无上限增长。
# 在 compose 层声明而非 daemon.json——配置入库、随 up -d 滚动重建生效，
# 不需要重启 docker daemon。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2
    container_name: blog-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      # 本机 80 被占用时用 HTTP_PORT/HTTPS_PORT 覆盖（如本地冒烟 8080）。
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    # 发布流水线（.github/workflows/release.yml）推 ghcr 镜像；服务器
    # docker compose pull 即更新。build 段保留作为无镜像环境的本机构建回退。
    image: ghcr.io/luohao0308/luohao-blog-frontend:latest
    container_name: blog-frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      NUXT_BACKEND_BASE: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 打轻量 Nitro /health 而非整页 SSR：探针不依赖数据层，backend/ES
      # 抖动不应把 frontend 判为 unhealthy 并绑架 caddy 启动。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      args:
        APT_MIRROR: mirrors.cloud.tencent.com
    image: ghcr.io/luohao0308/luohao-blog-backend:latest
    container_name: blog-backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      KRATOS_DATABASE_SOURCE: ${DATABASE_SOURCE}
      KRATOS_JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - ./prod-conf:/data/conf:ro
      # 用户上传（头像）落本地磁盘，命名卷保证容器替换不丢文件；
      # 备份见 deploy/backup.sh（uploads tar）。
      - backend-uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      es:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v1/articles/list?page_size=1"]
      interval: 15s
      timeout: 5s
      retries: 15

  mysql:
    image: mysql:8.4
    container_name: blog-mysql-prod
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: blog
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    # 仅内网：不发布端口，宿主机外不可达。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: blog-redis-prod
    restart: unless-stopped
    logging: *default-logging
    # 仅内网；S4 运维基线再评估密码/持久化策略。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: blog-es-prod
    restart: unless-stopped
    logging: *default-logging
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  mysql-data:
  es-data:
  backend-uploads:
