# Promtail：采集全部 compose 容器日志（docker SD，json-file 解析）
# + 宿主机脚本日志（watchdog/备份）。发送到同网络的 Loki。
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      - docker: {}

  - job_name: host-scripts
    static_configs:
      - targets: ["localhost"]
        labels:
          job: host-scripts
          host: blog-vps
          __path__: /var/log/host/blog-*.log
