apiVersion: 1

# Grafana 统一告警规则（Blog Alerts 文件夹）。
# 通知渠道（钉钉）不在此 provision——机器人 webhook 是密钥，由使用者在
# Grafana UI 的 Contact points 里创建一次并设为默认策略接收方，
# 步骤见 docs/operations/runbooks/RUNBOOK-monitoring.md。
# backend 指标相关规则（错误率/延迟）在 /metrics 上线前无数据，
# noDataState=OK 使其静默，指标出现后自动生效。
groups:
  - orgId: 1
    name: blog
    folder: Blog Alerts
    interval: 1m
    rules:
      - uid: blog-host-disk
        title: Host disk usage high
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Root filesystem usage above 85% for 15m. ES/MySQL 数据卷同盘，先清理再扩容。
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: '(1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) * 100'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [85]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: C
              type: threshold

      - uid: blog-host-mem
        title: Host memory low
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Available memory below 400MB for 5m. 先查 docker stats，防 ES/MySQL 被 OOM。
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: node_memory_MemAvailable_bytes
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [400000000]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: C
              type: threshold

      - uid: blog-api-5xx
        title: API 5xx rate high
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 5xx 占比超过 5% 持续 5m。按 operation 维度看 Grafana Blog Overview 定位接口。
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'sum(rate(blog_api_requests_total{code=~"5.."}[5m])) / clamp_min(sum(rate(blog_api_requests_total[5m])), 0.001)'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.05]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: C
              type: threshold

      - uid: blog-datalayer-down
        title: Data layer down (mysql/redis/es)
        condition: C
        for: 3m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: mysql/redis/elasticsearch exporter 报 up==0 持续 3m。docker ps 看容器，docker logs 看对应服务。
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'up{job=~"mysql|redis|elasticsearch"} == 0'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: C
              type: threshold

      - uid: blog-api-p95
        title: API p95 latency high
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 全站 p95 延迟超过 2s 持续 10m。留意 RAG 聊天（LLM 上游）与 ES 查询。
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'histogram_quantile(0.95, sum(rate(blog_api_request_duration_seconds_bucket[5m])) by (le))'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [2]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: C
              type: threshold
