# 发布流水线（M5/S3）：main 合并后构建生产镜像并推 ghcr。
# 服务器更新：docker compose -f deploy/compose.prod.yml pull backend frontend
#             && docker compose -f deploy/compose.prod.yml up -d backend frontend
# 回滚：把 compose.prod.yml 的 image tag 固定到 <sha> 后 up -d，或重新 pull 旧 sha。
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push images to ghcr
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          tags: |
            ghcr.io/${{ github.repository_owner }}/luohao-blog-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/luohao-blog-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
